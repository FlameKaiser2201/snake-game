<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smooth Snake</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Smooth Snake</h1>
        <p class="meta">
          <span>Score <strong id="score">0</strong></span>
          <span>Best <strong id="best">0</strong></span>
        </p>
      </header>
      <canvas id="game" width="672" height="576" aria-label="Snake game board"></canvas>
      <p class="help">Arrows or WASD to move · Space to pause · R to restart</p>
      <p class="note">Desktop pygame version: <code>python game.py</code></p>
    </main>
    <script src="/static/game.js"></script>
  </body>
</html>
